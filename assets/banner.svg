<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; opacity: 0.4; }
    
    /* Dynamic pulsing & flowing animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(25px, -15px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-30px, 20px); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-600px); }
    }

    .animated-dash {
      stroke-dasharray: 8, 6;
      animation: dashMove 3s linear infinite;
    }
    .orb-1 {
      animation: floatOrb1 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: floatOrb2 9s ease-in-out infinite;
      transform-origin: 1000px 260px;
    }
    .pill-anim-1 {
      animation: floatPill 4s ease-in-out infinite;
    }
    .pill-anim-2 {
      animation: floatPill 5s ease-in-out infinite 1s;
    }
    .pill-anim-3 {
      animation: floatPill 4.5s ease-in-out infinite 0.5s;
    }
    .pulse-node {
      animation: pulseGlow 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Background Animated Atmospheric Orbs -->
  <g class="orb-1" opacity="0.35">
    <circle cx="180" cy="90" r="130" fill="#38bdf8" filter="url(#glow)" opacity="0.25" />
    <circle cx="280" cy="140" r="90" fill="#6366f1" filter="url(#glow)" opacity="0.2" />
  </g>
  <g class="orb-2" opacity="0.35">
    <circle cx="1020" cy="270" r="140" fill="#a855f7" filter="url(#glow)" opacity="0.2" />
    <circle cx="920" cy="200" r="100" fill="#06b6d4" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Technical Grid Background -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Neural/Decision Attributions (Flow lines in background) -->
  <g opacity="0.5">
    <!-- Connecting curves with animated dashes -->
    <path d="M 80,180 C 220,90 320,240 460,180" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-dash" />
    <path d="M 740,180 C 880,120 980,270 1120,180" fill="none" stroke="#c084fc" stroke-width="2" class="animated-dash" />
    <path d="M 120,280 C 250,330 350,210 500,260" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M 700,100 C 850,50 950,150 1080,100" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Interactive/Dynamic Feature Attribution Nodes (Glassbox & SHAP representation) -->
  <g class="pulse-node" opacity="0.8">
    <circle cx="100" cy="180" r="6" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="460" cy="180" r="5" fill="#38bdf8" />
    <circle cx="740" cy="180" r="5" fill="#c084fc" />
    <circle cx="1100" cy="180" r="6" fill="#c084fc" filter="url(#subtleGlow)" />
  </g>

  <!-- Dynamic Attribution Bars / Feature Importance Representation (Bottom-left & Bottom-right) -->
  <g opacity="0.4">
    <!-- Left Feature Bar Group -->
    <rect x="70" y="295" width="80" height="6" rx="3" fill="#38bdf8" />
    <rect x="70" y="307" width="120" height="6" rx="3" fill="#818cf8" />
    <rect x="70" y="319" width="55" height="6" rx="3" fill="#06b6d4" />
    <!-- Right Feature Bar Group -->
    <rect x="1030" y="295" width="100" height="6" rx="3" fill="#c084fc" />
    <rect x="990" y="307" width="140" height="6" rx="3" fill="#818cf8" />
    <rect x="1060" y="319" width="70" height="6" rx="3" fill="#38bdf8" />
  </g>

  <!-- Badges / Floating Concept Pills (Foreground, Above Background, Below Titles) -->
  <g class="pill-anim-1">
    <rect x="430" y="42" width="100" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="480" y="59" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SHAP &amp; LIME</text>
  </g>

  <g class="pill-anim-2">
    <rect x="545" y="42" width="110" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <text x="600" y="59" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">GLASSBOX / EBM</text>
  </g>

  <g class="pill-anim-3">
    <rect x="670" y="42" width="100" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <text x="720" y="59" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">XAI &amp; FAIRNESS</text>
  </g>

  <!-- MAIN HEADINGS (Unobstructed Foreground) -->
  <!-- Title -->
  <text x="600" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5" filter="url(#subtleGlow)">
    Awesome Machine Learning Interpretability
  </text>

  <!-- Subtitle -->
  <text x="600" y="196" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0.2">
    Curated Hub for Explainable AI (XAI), Attribution Frameworks &amp; Model Auditing Tools
  </text>

  <!-- Tagline / Description -->
  <text x="600" y="232" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">
    Transparent Glassbox Models &bull; Post-Hoc Explainers &bull; Fairness Auditing &bull; Enterprise Governance SaaS
  </text>

  <!-- Subtle Bottom Indicator -->
  <g opacity="0.8">
    <line x1="480" y1="262" x2="720" y2="262" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
